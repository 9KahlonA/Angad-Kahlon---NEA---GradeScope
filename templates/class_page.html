<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ class_name }} - Students</title>
</head>
<body>
    <h1>Class: {{ class_name }}</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Language</th>
                <th>Literature</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.language }}</td>
                <td>{{ student.literature }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
