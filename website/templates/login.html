<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <style>
    /* General styling for the body to set font, background, and layout */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1f2d1f, #3a4e3a);
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Styling for the login container */
    .login-container {
      background: #2b2f2b;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    /* Styling for the header */
    .login-container h1 {
      margin-bottom: 30px;
      font-size: 2rem;
      color: #d2f5d2;
    }

    /* Styling for input fields */
    .login-container input {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      box-sizing: border-box;
      background-color: #3b403b;
      color: #ffffff;
    }

    /* Placeholder text styling */
    .login-container input::placeholder {
      color: #a5bba5;
    }

    /* Styling for the login button */
    .login-container button {
      width: 100%;
      padding: 12px 15px;
      background-color: #4d7253;
      border: none;
      border-radius: 5px;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 20px;
    }

    /* Hover effect for the button */
    .login-container button:hover {
      background-color: #3d5c44;
    }

    /* Loading overlay styles */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    /* Active state for loading overlay */
    .loading-overlay.active {
      display: flex;
    }

    /* Spinner animation for loading */
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    /* Keyframes for spinner animation */
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <!-- Link to external JavaScript file for login functionality -->
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</head>
<body>
  <div class="login-container">
    <h1>GradeScope</h1>
    <!-- Login form -->
    <form method="POST" action="{{ url_for('auth.login') }}">
      <!-- CSRF token for security -->
      {% if csrf_token %}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% endif %}
      <!-- Input for username -->
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required>
      <!-- Input for password -->
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
      <!-- Submit button -->
      <button type="submit">Login</button>
    </form>
  </div>
  <!-- Loading overlay displayed during form submission -->
  <div class="loading-overlay">
    <div class="spinner"></div>
  </div>
</body>
</html>
