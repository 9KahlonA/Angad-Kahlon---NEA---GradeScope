<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Literature - Classes</title>
  <style>
    /* General styling for the body to set font, background, and layout */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1f2d1f, #3a4e3a);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* Styling for the container holding the table */
    .container {
      background: #2b2f2b;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 500px;
    }

    /* Styling for the header */
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    /* Styling for the table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    /* Styling for table borders */
    table, th, td {
      border: 1px solid #ddd;
    }

    /* Styling for table cells */
    th, td {
      padding: 10px;
      text-align: left;
    }

    /* Styling for table headers */
    th {
      background-color: #4d7253;
      color: white;
    }

    /* Hover effect for table rows */
    tr:hover {
      background-color: #3d5c44;
    }

    /* Styling for links */
    a {
      color: #f0f0f0;
      text-decoration: none;
    }

    /* Hover effect for links */
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>English Literature - Classes</h1>
    <!-- Table showing classes -->
    <table>
      <thead>
        <tr>
          <th>Class Code</th>
        </tr>
      </thead>
      <tbody>
        <!-- Loop through classes and display each as a row -->
        {% for class in classes %}
        <tr>
          <td>
            <!-- Link to view students in the selected class -->
            <a href="{{ url_for('views.literature_class_students', class_id=class.class_id) }}">
              {{ class.class_code }}
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
