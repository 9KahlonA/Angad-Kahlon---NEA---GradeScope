<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Literature - Year Groups</title>
  <style>
    /* General styling for the body */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1f2d1f, #3a4e3a);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* Styling for the container holding the table */
    .container {
      background: #2b2f2b;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 500px;
    }

    /* Header styling */
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    /* Table cell and header styling */
    table, th, td {
      border: 1px solid #ddd;
    }

    th, td {
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #4d7253;
      color: white;
    }

    /* Hover effect for table rows */
    tr:hover {
      background-color: #3d5c44;
    }

    /* Link styling */
    a {
      color: #f0f0f0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>English Literature - Year Groups</h1>
    <!-- Table showing year groups -->
    <table>
      <thead>
        <tr>
          <th>Year Group</th>
        </tr>
      </thead>
      <tbody>
        <!-- Loop through year groups and display each as a row -->
        {% for year_group in year_groups %}
        <tr>
          <td>
            <!-- Link to view classes for the selected year group -->
            <a href="{{ url_for('views.literature_classes', year_group_id=year_group.yeargroup_id) }}">
              {{ year_group.year }}
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
