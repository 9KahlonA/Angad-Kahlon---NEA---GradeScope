 <!DOCTYPE html >
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Student Search - GradeScope</title>
  <style>
    
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background :linear-gradient( to right, #1f2d1f,#3a4e3a) ;
      color : #f0f0f0;
      min-height:100vh ;
    }

    
    .container {
      background:#2b2f2b;
      padding :30px;
      border-radius: 10px;
      box-shadow : 0 4px 10px rgba( 0,0, 0,0.5) ;
      margin: 80px 20px 20px 20px ;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #4fd1c5;
      text-align: center;
    }

    h2 {
      color: #4fd1c5;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    
    .search-section {
      margin-bottom: 30px;
      padding: 25px;
      background: #3a4e3a;
      border-radius: 10px;
      border: 1px solid #4d7253;
    }

    .search-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .search-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 15px;
      align-items: end;
    }

    .search-input {
      padding: 12px 15px;
      border: 2px solid #4d7253;
      border-radius: 5px;
      background: #2b2f2b;
      color: #f0f0f0;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: #4fd1c5;
      box-shadow: 0 0 5px rgba(79, 209, 197, 0.3);
    }

    .search-button {
      padding: 12px 25px;
      background: #4d7253;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .search-button:hover {
      background: #3d5c44;
    }

    
    .results-section {
      margin-top: 30px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .results-count {
      color: #4fd1c5;
      font-weight: bold;
    }

    .clear-search {
      padding: 8px 15px;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .clear-search:hover {
      background: #5a6268;
    }

    
    .student-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 20px;
    }

    .student-card {
      background: #3a4e3a;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #4d7253;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .student-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .student-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .student-name {
      font-size: 1.3rem;
      font-weight: bold;
      color: #4fd1c5;
    }

    .student-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.8rem;
      color: #4d7253;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .info-value {
      color: #f0f0f0;
      font-size: 0.9rem;
    }

    .grades-section {
      margin-top: 15px;
    }

    .grades-title {
      font-size: 1rem;
      color: #4fd1c5;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .grades-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .grade-item {
      text-align: center;
      padding: 8px;
      background: #2b2f2b;
      border-radius: 5px;
      border: 1px solid #4d7253;
    }

    .grade-term {
      font-size: 0.7rem;
      color: #4d7253;
      margin-bottom: 2px;
    }

    .grade-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f0f0f0;
    }

    
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      justify-content: space-between;
    }

    .action-button {
      flex: 1;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .prediction-button {
      background: #4d7253;
      color: white;
    }

    .prediction-button:hover {
      background: #3d5c44;
      transform: translateY(-1px);
    }

    .edit-button {
      background: #6c757d;
      color: white;
    }

    .edit-button:hover {
      background: #5a6268;
      transform: translateY(-1px);
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #ccc;
      font-style: italic;
      font-size: 1.1rem;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #4fd1c5;
      font-size: 1.1rem;
    }

    
    @media (max-width: 768px) {
      .container {
        margin: 80px 10px 20px 10px;
        padding: 20px;
      }

      .search-form {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .student-cards {
        grid-template-columns: 1fr;
      }

      .student-info {
        grid-template-columns: 1fr;
      }

      .grades-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .action-buttons {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  {% include 'navbar.html' %}
  
  <div class="container">
    <h1>Student Search</h1>
    
    
    <div class="search-section">
      <h2>Search Students</h2>
      <div class="search-container">
        <div class="search-form">
          <input type="text" id="firstNameInput" placeholder="First Name (optional)" class="search-input">
          <input type="text" id="lastNameInput" placeholder="Last Name (optional)" class="search-input">
          <input type="number" id="yearGroupInput" placeholder="Year Group (7-11)" min="7" max="11" class="search-input">
          <button id="searchButton" class="search-button">Search</button>
        </div>
      </div>
    </div>

    
    <div class="results-section" id="resultsSection" style="display: none;">
      <div class="results-header">
        <div class="results-count" id="resultsCount">0 results found</div>
        <button class="clear-search" id="clearSearch">Clear Search</button>
      </div>
      <div id="searchResults" class="student-cards">
        
      </div>
    </div>

    
    <div id="loadingMessage" class="loading" style="display: none;">
      Searching...
    </div>
    <div id="noResultsMessage" class="no-results" style="display: none;">
      No students found matching your search criteria.
    </div>
  </div>

  <script>
    // Global functions that can be called from onclick handlers
    function viewStudent(studentId) {
      console.log('Card clicked for student:', studentId);
      window.location.href = `/student/${studentId}`;
    }

    function viewProjections(studentId) {
      console.log('Viewing projections for student:', studentId);
      window.location.href = `/student/${studentId}/projections?from=search`;
    }

    function editStudent(studentId) {
      console.log('Editing student:', studentId);
      window.location.href = `/student/${studentId}?from=search`;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const searchButton = document.getElementById('searchButton');
      const firstNameInput = document.getElementById('firstNameInput');
      const lastNameInput = document.getElementById('lastNameInput');
      const yearGroupInput = document.getElementById('yearGroupInput');
      const searchResults = document.getElementById('searchResults');
      const resultsSection = document.getElementById('resultsSection');
      const loadingMessage = document.getElementById('loadingMessage');
      const noResultsMessage = document.getElementById('noResultsMessage');
      const resultsCount = document.getElementById('resultsCount');
      const clearSearch = document.getElementById('clearSearch');

      // Handle search button click
      searchButton.addEventListener('click', performSearch);

      // Handle clear search
      clearSearch.addEventListener('click', clearSearchResults);

      // Handle Enter key press in any input field
      [firstNameInput, lastNameInput, yearGroupInput].forEach(input => {
        input.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            performSearch();
          }
        });
      });

      function performSearch() {
        const firstName = firstNameInput.value.trim();
        const lastName = lastNameInput.value.trim();
        const yearGroup = yearGroupInput.value.trim();

        // Client-side validation
        if (!firstName && !lastName && !yearGroup) {
          alert('Please enter at least one search criteria');
          return;
        }

        if (firstName && firstName.length < 2) {
          alert('First name must be at least 2 characters long');
          return;
        }

        if (lastName && lastName.length < 2) {
          alert('Last name must be at least 2 characters long');
          return;
        }

        if (yearGroup) {
          const yearNum = parseInt(yearGroup);
          if (isNaN(yearNum) || yearNum < 7 || yearNum > 11) {
            alert('Year group must be a number between 7 and 11');
            return;
          }
        }

        // Show loading state
        resultsSection.style.display = 'none';
        noResultsMessage.style.display = 'none';
        loadingMessage.style.display = 'block';

        // Perform AJAX search
        const formData = new FormData();
        if (firstName) formData.append('first_name', firstName);
        if (lastName) formData.append('last_name', lastName);
        if (yearGroup) formData.append('year_group', yearGroup);

        fetch('{{ url_for("auth.search_students") }}', {
          method: 'POST',
          body: formData
        })
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          loadingMessage.style.display = 'none';
          
          if (data.error) {
            noResultsMessage.innerHTML = `Error: ${data.error}`;
            noResultsMessage.style.display = 'block';
          } else if (data.results && Array.isArray(data.results) && data.results.length > 0) {
            displayResults(data.results);
          } else {
            noResultsMessage.style.display = 'block';
          }
        })
        .catch(error => {
          loadingMessage.style.display = 'none';
          noResultsMessage.innerHTML = `An error occurred while searching: ${error.message}. Please try again.`;
          noResultsMessage.style.display = 'block';
        });
      }

      function displayResults(results) {
        resultsCount.textContent = `${results.length} result${results.length !== 1 ? 's' : ''} found`;
        
        let html = '';
        results.forEach(student => {
          html += `
            <div class="student-card" onclick="viewStudent(${student.student_id})">
              <div class="student-header">
                <div class="student-name">${escapeHtml(student.name)}</div>
              </div>
              
              <div class="student-info">
                <div class="info-item">
                  <div class="info-label">Class</div>
                  <div class="info-value">${escapeHtml(student.class)}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Year Group</div>
                  <div class="info-value">${escapeHtml(student.year_group)}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Ethnicity</div>
                  <div class="info-value">${escapeHtml(student.ethnicity)}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Home Language</div>
                  <div class="info-value">${escapeHtml(student.home_language)}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Reading Age</div>
                  <div class="info-value">${escapeHtml(student.reading_age)}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Student ID</div>
                  <div class="info-value">${student.student_id}</div>
                </div>
              </div>

              <div class="grades-section">
                <div class="grades-title">Recent Grades</div>
                <div class="grades-grid">
                  <div class="grade-item">
                    <div class="grade-term">Autumn</div>
                    <div class="grade-value">${student.grades?.Autumn || 'N/A'}</div>
                  </div>
                  <div class="grade-item">
                    <div class="grade-term">Winter</div>
                    <div class="grade-value">${student.grades?.Winter || 'N/A'}</div>
                  </div>
                  <div class="grade-item">
                    <div class="grade-term">Spring</div>
                    <div class="grade-value">${student.grades?.Spring || 'N/A'}</div>
                  </div>
                  <div class="grade-item">
                    <div class="grade-term">Summer</div>
                    <div class="grade-value">${student.grades?.Summer || 'N/A'}</div>
                  </div>
                </div>
              </div>

              <div class="action-buttons">
                <button class="action-button prediction-button" onclick="event.stopPropagation(); console.log('Prediction button clicked for student:', ${student.student_id}); viewProjections(${student.student_id})">
                  Grade Prediction
                </button>
                <button class="action-button edit-button" onclick="event.stopPropagation(); console.log('Edit button clicked for student:', ${student.student_id}); editStudent(${student.student_id})">
                  Edit Details
                </button>
              </div>
            </div>
          `;
        });
        
        searchResults.innerHTML = html;
        resultsSection.style.display = 'block';
      }

      function clearSearchResults() {
        firstNameInput.value = '';
        lastNameInput.value = '';
        yearGroupInput.value = '';
        resultsSection.style.display = 'none';
        noResultsMessage.style.display = 'none';
        loadingMessage.style.display = 'none';
        searchResults.innerHTML = '';
      }


      function escapeHtml(text) {
        if (typeof text !== 'string') {
          text = String(text);
        }
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
      }
    });
  </script>
</body>
</html>
