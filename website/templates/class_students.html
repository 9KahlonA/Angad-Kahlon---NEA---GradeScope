<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ subject }} - Class Students</title>
  <style>
    /* General styling for the body to set font, background, and layout */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1f2d1f, #3a4e3a);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* Align content to the top */
      min-height: 100vh;
      overflow-x: hidden; /* Prevent horizontal scrolling */
    }

    /* Styling for the container holding the table */
    .container {
      background: #2b2f2b;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 90%; /* Adjust width to fit within the window */
      max-width: 800px;
      margin-top: 20px; /* Add spacing from the top */
    }

    /* Styling for the header */
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    /* Styling for the table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    /* Styling for table borders */
    table, th, td {
      border: 1px solid #ddd;
    }

    /* Styling for table cells */
    th, td {
      padding: 10px;
      text-align: left;
    }

    /* Styling for table headers */
    th {
      background-color: #4d7253;
      color: white;
    }

    /* Hover effect for table rows */
    tr:hover {
      background-color: #3d5c44;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{ subject }} - Class Students</h1>
    <!-- Table displaying students and their grades -->
    <table>
      <thead>
        <tr>
          <th>Student Name</th>
          <!-- Loop through terms and display each as a column -->
          {% for column in terms_columns %}
          <th>{{ column }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
        <!-- Loop through students and display their details -->
        {% for student in students %}
        <tr>
          <td>
            <!-- Link to view details of the selected student -->
            <a href="{{ url_for('views.student_details', student_id=student.student_id) }}">
              {{ student.first_name }} {{ student.last_name }}
            </a>
          </td>
          <!-- Loop through terms and display grades for each student -->
          {% for column in terms_columns %}
          <td>{{ student_grades[student.student_id][column] }}</td>
          {% endfor %}
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
