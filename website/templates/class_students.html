<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ subject }} - Class Students</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1f2d1f, #3a4e3a);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* Align content to the top */
      min-height: 100vh;
      overflow-x: hidden; /* Prevent horizontal scrolling */
    }

    .container {
      background: #2b2f2b;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 90%; /* Adjust width to fit within the window */
      max-width: 800px;
      margin-top: 20px; /* Add spacing from the top */
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    table, th, td {
      border: 1px solid #ddd;
    }

    th, td {
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #4d7253;
      color: white;
    }

    tr:hover {
      background-color: #3d5c44;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{ subject }} - Class Students</h1>
    <table>
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Column 1</th>
          <th>Column 2</th>
          <th>Column 3</th>
          <th>Column 4</th>
        </tr>
      </thead>
      <tbody>
        {% for student in students %}
        <tr>
          <td><a href="{{ url_for('views.student_details', student_id=student.student_id) }}">{{ student.first_name }} {{ student.last_name }}</a></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
