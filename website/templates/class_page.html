<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ class_name }} - Students</title>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(to right, #1f2d1f, #3a4e3a);
            color: #f0f0f0;
        }

        /* Header styling */
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            background: #2b2f2b;
            color: #f0f0f0;
        }

        /* Table cell and header styling */
        th,
        td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        /* Header row background color */
        th {
            background-color: #4d7253;
        }

        /* Alternate row background color */
        tr:nth-child(even) {
            background-color: #3a4e3a;
        }

        /*
       This dosent seem to work yet, but is the styling to remove the color and undelrine form the studenrt names
        table a {
            color: #ffffff !important;
            text-decoration: none !important;
        }

        table a:hover {
            text-decoration: underline !important;
        }
        */
    </style>
</head>

<body>
    <!-- Page header -->
    <h1>Class: {{ class_name }}</h1>
    <table>
        <thead>
            <tr>
                <!-- Table header for student name -->
                <th>Student Name</th>
                {% for column in terms_columns %}
                <!-- Dynamic table headers based on terms_columns -->
                <th>{{ column }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <!-- Student name with a placeholder link -->
                <td><a href="#">{{ student.name }}</a></td>
                {% for column in terms_columns %}
                <!-- Dynamic table data for each student -->
                <td>{{ student[column] }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
