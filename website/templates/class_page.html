<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ class_name }} - Students</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(to right, #1f2d1f, #3a4e3a);
            color: #f0f0f0;
        }

        
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            background: #2b2f2b;
            color: #f0f0f0;
        }

        
        th,
        td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        
        th {
            background-color: #4d7253;
        }

        
        tr:nth-child(even) {
            background-color: #3a4e3a;
        }

        /*
       This dosent seem to work yet, but is the styling to remove the color and undelrine form the studenrt names
        table a {
            color: #ffffff !important;
            text-decoration: none !important;
        }

        table a:hover {
            text-decoration: underline !important;
        }
        */

        
        .page-wrapper {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            width: 100vw;
        }

        .container {
            background: #2b2f2b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        {% include 'navbar.html' %}
        <div class="container" style="margin-top: 80px;">
            
            <h1>Class: {{ class_name }}</h1>
            <table>
                <thead>
                    <tr>
                        
                        <th>Student Name</th>
                        {% for column in terms_columns %}
                        
                        <th>{{ column }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        
                        <td><a href="#">{{ student.name }}</a></td>
                        {% for column in terms_columns %}
                        
                        <td>{{ student[column] }}</td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
