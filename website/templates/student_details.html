<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Student Details</title>
  <style>
    /* General styling for the body to set font, background, and layout */
    body {
      /* Setting up the font and background for a clean look */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1f2d1f, #3a4e3a);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    /* Styling for the container holding the form */
    .container {
      /* Adding padding and shadow for a card-like appearance */
      background: #2b2f2b;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 90%;
      max-width: 600px;
      margin-top: 20px;
    }

    /* Styling for the header */
    h1 {
      /* Making the header stand out */
      font-size: 2rem;
      margin-bottom: 10px;
    }

    /* Styling for the form layout */
    form {
      /* Aligning form elements vertically */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Styling for labels */
    label {
      /* Ensuring labels are aligned with inputs */
      margin-top: 10px;
      width: 100%;
      max-width: 400px;
      text-align: left;
    }

    /* Styling for input fields */
    input[type="text"], input[type="number"] {
      /* Making inputs user-friendly */
      width: 100%;
      max-width: 400px;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    /* Styling for the submit button */
    button {
      /* Adding a nice button style */
      margin-top: 20px;
      padding: 10px;
      background-color: #4d7253;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Hover effect for the button */
    button:hover {
      /* Slight color change on hover */
      background-color: #3d5c44;
    }

    /* Styling for success message */
    .success {
      /* Highlighting success messages */
      color: #4caf50;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Edit Student Details</h1>
    <!-- Display success message if the update was successful -->
    {% if success %}
    <p class="success">Student details updated successfully!</p>
    {% endif %}
    <!-- Form for editing student details -->
    <form method="POST"> <!-- Ensure the method is POST -->
      <!-- Input for first name -->
      <label for="first_name">First Name:</label>
      <input type="text" id="first_name" name="first_name" value="{{ student.first_name }}" required>

      <!-- Input for last name -->
      <label for="last_name">Last Name:</label>
      <input type="text" id="last_name" name="last_name" value="{{ student.last_name }}" required>

      <!-- Input for ethnicity -->
      <label for="ethnicity">Ethnicity:</label>
      <input type="text" id="ethnicity" name="ethnicity" value="{{ student.ethnicity }}">

      <!-- Input for home language -->
      <label for="home_language">Home Language:</label>
      <input type="text" id="home_language" name="home_language" value="{{ student.home_language }}">

      <!-- Input for reading age -->
      <label for="reading_age">Reading Age:</label>
      <input type="number" id="reading_age" name="reading_age" step="0.1" value="{{ student.reading_age }}">

      <!-- Submit button -->
      <button type="submit">Save Changes</button>
    </form>
  </div>
</body>
</html>
