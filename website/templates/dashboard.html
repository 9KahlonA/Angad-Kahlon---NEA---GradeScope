<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1f2d1f, #3a4e3a);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background: #2b2f2b;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .dashboard-card {
      background: #4d7253;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-5px);
      background: #3d5c44;
    }

    .dashboard-card a {
      color: #f0f0f0;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .dashboard-card a:hover {
      color: #ffffff;
    }

    .dashboard-card img {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
    }

    .search-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #555;
    }

    .search-button {
      background: #dc3545;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 5px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .search-button:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
  {% include 'navbar.html' %}
  <div class="container">
    <h1>GradeScope Dashboard</h1>
    
    <div class="dashboard-grid">
      <div class="dashboard-card">
        <a href="{{ url_for('views.language') }}">
          <img src="{{ url_for('static', filename='assets/images/english_language.png') }}" alt="English Language">
          <br>English Language
        </a>
      </div>
      
      <div class="dashboard-card">
        <a href="{{ url_for('views.literature') }}">
          <img src="{{ url_for('static', filename='assets/images/english_literature.png') }}" alt="English Literature">
          <br>English Literature
        </a>
      </div>
    </div>
    
    <div class="search-section">
      <h3>Student Search</h3>
      <button class="search-button" onclick="window.location.href='{{ url_for('auth.search_page') }}'">
        Search Students
      </button>
    </div>
  </div>
</body>
</html>
