<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1f2d1f, #3a4e3a);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background: #2b2f2b;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .button-container {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 150px;
      height: 150px;
      background-color: #4d7253;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
      text-decoration: none;
    }

    .button img {
      width: 50px;
      height: 50px;
      margin-bottom: 10px;
    }

    .button:hover {
      background-color: #3d5c44;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Your Dashboard</h1>
    <p>Please select your subject</p>
    <div class="button-container">
      <a href="{{ url_for('views.language') }}" class="button">
        <img src="{{ url_for('static', filename='assets/images/english_language.png') }}" alt="Language Icon">
        English Language
      </a>
      <a href="{{ url_for('views.literature') }}" class="button">
        <img src="{{ url_for('static', filename='assets/images/english_literature.png') }}" alt="Literature Icon">
        English Literature
      </a>
    </div>
  </div>
</body>
</html>
