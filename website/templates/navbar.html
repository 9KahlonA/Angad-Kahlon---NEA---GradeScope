<link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
<nav class="top-navbar">
  {% if navigation and navigation.show_back %}
  <div class="navbar-left">
    <a href="{{ url_for(navigation.back_url, **navigation.get('back_params', {})) }}" class="back-button" title="{{ navigation.back_text }}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span class="back-text">{{ navigation.back_text }}</span>
    </a>
  </div>
  {% endif %}
  <a href="{{ url_for('auth.dashboard') }}" class="navbar-title">Gradescope</a>
  <div class="profile-menu">
    <img src="{{ url_for('static', filename='assets/images/profile_icon.png') }}" alt="Profile" class="profile-icon">
    <div class="dropdown">
      <button id="logout-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16,17 21,12 16,7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
    </div>
  </div>
</nav>
<script>
document.getElementById('logout-button').addEventListener('click', function () {
  const loadingOverlay = document.createElement('div');
  loadingOverlay.className = 'loading-overlay active';
  loadingOverlay.innerHTML = '<div class="spinner"></div>';
  document.body.appendChild(loadingOverlay);

  setTimeout(() => {
    window.location.href = "{{ url_for('auth.login') }}";
  }, 1000);
});
</script>
<div class="loading-overlay">
  <div class="spinner"></div>
</div>
