<style>
  .top-navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: #2b2f2b; 
    color: #f0f0f0;
    display: flex;
    align-items: center;
    box-shadow: none;
    z-index: 100;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }
  .navbar-left {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
  }

  .back-button {
    background: #4d7253;
    color: #f0f0f0;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    gap: 6px;
  }

  .back-button:hover {
    background: #3d5c44;
    transform: translateX(-2px);
    color: #f0f0f0;
    text-decoration: none;
  }

  .back-button:active {
    transform: translateX(-1px);
  }

  .back-text {
    font-size: 14px;
    font-weight: 500;
  }

  .navbar-title {
    text-decoration: none;
    color: #4fd1c5;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    font-size: 1.5rem;
    font-weight: bold;
    text-shadow: 1px 1px 2px #222;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  .profile-menu {
    position: absolute;
    right: 20px;
    top: 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    z-index: 10;
  }

  .profile-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .profile-icon:hover {
    transform: scale(1.1);
  }

  .dropdown {
    display: none;
    margin-top: 5px;
    background: #2b2f2b;
    border-radius: 5px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  }

  .dropdown button {
    background: #4d7253;
    color: white;
    border: none;
    padding: 10px 15px;
    width: 100%;
    text-align: left;
    cursor: pointer;
    border-radius: 5px;
    transition: background 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }

  .dropdown button:hover {
    background: #3d5c44;
  }

  .profile-menu:hover .dropdown {
    display: block;
    animation: dropdown-expand 0.3s ease;
  }

  @keyframes dropdown-expand {
    from {
      opacity: 0;
      transform: scaleY(0);
    }
    to {
      opacity: 1;
      transform: scaleY(1);
    }
  }

  /* Loading overlay styling */
  .loading-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }

  .loading-overlay.active {
    display: flex;
  }

  /* Spinner animation for loading */
  .spinner {
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-top: 4px solid #fff;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }
</style>
<nav class="top-navbar">
  <!-- Back button. Dynamically  displayed based on navigation path -->
  {% if navigation and navigation.show_back %}
  <div class="navbar-left">
    <a href="{{ url_for(navigation.back_url, **navigation.get('back_params', {})) }}" class="back-button" title="{{ navigation.back_text }}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span class="back-text">{{ navigation.back_text }}</span>
    </a>
  </div>
  {% endif %}
  <a href="{{ url_for('auth.dashboard') }}" class="navbar-title">Gradescope</a>
  <!-- Profile menu with logout dropdown -->
  <div class="profile-menu">
    <img src="{{ url_for('static', filename='assets/images/profile_icon.png') }}" alt="Profile" class="profile-icon">
    <div class="dropdown">
      <button id="logout-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16,17 21,12 16,7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
    </div>
  </div>
</nav>
<script>
// shows loading overlay and redirects to logout route, and the dropdown animation for logout
document.getElementById('logout-button').addEventListener('click', function () {
  const loadingOverlay = document.createElement('div');
  loadingOverlay.className = 'loading-overlay active';
  loadingOverlay.innerHTML = '<div class="spinner"></div>';
  document.body.appendChild(loadingOverlay);

  // Redirect to logout route which will clear session and redirect to login
  window.location.href = "{{ url_for('auth.logout') }}";
});
</script>
<div class="loading-overlay">
  <div class="spinner"></div>
</div>
