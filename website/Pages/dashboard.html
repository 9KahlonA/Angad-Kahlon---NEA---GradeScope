<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1f2d1f, #3a4e3a);
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .dashboard-container {
      background: #2b2f2b;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 600px;
      box-sizing: border-box;
    }

    .dashboard-container h1 {
      margin-bottom: 20px;
      font-size: 2.5rem;
      color: #d2f5d2;
    }

    .dashboard-container p {
      font-size: 1.2rem;
      color: #a5bba5;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <h1>Welcome to the Dashboard</h1>
    <p>You have successfully logged in.</p>
  </div>
</body>
</html>
